name: Toolbox
options:
  bundleIdPrefix: com.jchicano
  deploymentTarget:
    macOS: "12.0"
  developmentRegion: en
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

configs:
  Debug:
    type: debug
  Release:
    type: release

packages:
  ToolboxCore:
    path: Packages/ToolboxCore

targets:
  Toolbox:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: App
        excludes:
          - LoginItem
          - "**/*.md"
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Toolbox
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        CFBundleDevelopmentRegion: en
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Jay Chicano. MIT License."
    entitlements:
      path: Config/Toolbox.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jchicano.toolbox
        PRODUCT_NAME: Toolbox
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: $(ARCHS_STANDARD)
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
          ONLY_ACTIVE_ARCH: YES
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          ARCHS: arm64 x86_64
          ONLY_ACTIVE_ARCH: NO
    dependencies:
      - package: ToolboxCore
      - target: ToolboxLoginItem
        embed: false
    postBuildScripts:
      - name: Embed LoginItem helper
        script: |
          HELPER="${CONFIGURATION_BUILD_DIR}/ToolboxLoginItem.app"
          DEST="${CONFIGURATION_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LoginItems/ToolboxLoginItem.app"
          if [ -e "$HELPER" ]; then
            mkdir -p "$(dirname "$DEST")"
            rm -rf "$DEST"
            # -L: archive builds expose the helper as a symlink; dereference it.
            cp -RL "$HELPER" "$DEST"
          fi
    scheme:
      testTargets:
        - ToolboxAppTests

  ToolboxLoginItem:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: App/LoginItem
    info:
      path: Config/ToolboxLoginItem-Info.plist
    settings:
      base:
        PRODUCT_NAME: ToolboxLoginItem
        PRODUCT_MODULE_NAME: ToolboxLoginItem
        PRODUCT_BUNDLE_IDENTIFIER: com.jchicano.toolbox.loginitem
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ARCHS: arm64 x86_64
          ONLY_ACTIVE_ARCH: NO

  ToolboxAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Tests/ToolboxAppTests
    dependencies:
      - target: Toolbox
      - package: ToolboxCore
    settings:
      base:
        PRODUCT_NAME: ToolboxAppTests
        PRODUCT_MODULE_NAME: ToolboxAppTests
        PRODUCT_BUNDLE_IDENTIFIER: com.jchicano.toolbox.tests
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES

schemes:
  Toolbox:
    build:
      targets:
        Toolbox: all
        ToolboxAppTests: [test]
    test:
      targets:
        - ToolboxAppTests
